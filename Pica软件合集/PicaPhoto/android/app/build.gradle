plugins { id 'com.android.application' }
android {
    namespace 'com.picaphoto.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.picaphoto.app"
        minSdk 24
        targetSdk 34
        versionCode 64
        versionName "2.0.14"
    }
    signingConfigs {
        if (System.getenv('PICA_ANDROID_KEYSTORE_FILE')) {
            release {
                storeFile file(System.getenv('PICA_ANDROID_KEYSTORE_FILE'))
                storePassword System.getenv('PICA_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('PICA_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('PICA_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('PICA_ANDROID_KEYSTORE_FILE')) signingConfig signingConfigs.release
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
